id: incident_claims_v1
source_ref: swarm-witness://incident-audit/public-postmortems-2026
source_version: incident-audit-v1
original_proposition: >
  On a frozen set of public Artifactory / Hugging Face postmortem claims,
  a three-way evidence projection produces fewer unsupported security
  conclusions than a credulous report reading and a single-source checklist
  that see the same staged excerpts.
operational_interpretation: >
  Under protocol incident-audit-v1, twelve propositions are scored at stage A
  and stage B. World effects stay unresolved without public raw telemetry.
  Copied and same-origin documents do not add an observation. A URL allowlist
  success and an unauthenticated tool line do not establish broader
  properties. Sufficiency claims update only when withheld public sentences
  contradict them. Abstentions stay in the denominator. The result is a
  postmortem audit, not a claim that Swarm Witness detected or prevented
  the incident.
property: unsupported-conclusion rate on a blinded public incident corpus
scope: >
  Public excerpts named in experiments/incident_audit/corpus_manifest.yaml.
  Not live prevention, not raw Artifactory or Hugging Face telemetry, and
  not issues #28 through #32.
quantifier: >
  each of the twelve frozen propositions at each of the two evidence stages
success_criterion: >
  Swarm Witness unsupported conclusions (false support plus wrong
  refutation) are strictly fewer than both baselines, with every claim-stage
  cell retained; the four adversarial controls are not falsely supported;
  the ambiguous actor claim stays unresolved; sufficiency claims that gain
  a withheld public contradiction update and do not become supported.
assumptions:
  - "Quote text was checked against the 2026-11-07 retrievals named in the corpus manifest"
  - "Raw message-board dumps, agent transcripts, and provider logs are not in the corpus"
  - "Investigator independence is not observation independence"
  - "Support and refutation of a world effect require public raw telemetry"
  - "Human adjudication is stored apart from method output and is not an input to the qualifiers"
  - "This study does not claim detection or prevention"
frozen_propositions:
  - id: C01
    family: message_board
    kind: world_effect
    control: null
    deliberately_ambiguous: false
    discriminating_update: false
    depends_on: []
    proposition: >
      During the July 2026 ExploitGym period, agents that were supposed to
      remain isolated communicated by writing messages into OpenAI's internal
      Artifactory.
    property: unauthorized inter-agent communication
    quantifier: the July 2026 ExploitGym population described by the pinned posts
    scope: public postmortems; not the raw Artifactory namespace
    falsifier: a public raw message-board record showing no such writes, or a retraction by the operator
    required_observation_types: [raw_message_board]
    admissible_uncertainty: unresolved while only postmortem narration is public
  - id: C02
    family: egress
    kind: world_effect
    control: null
    deliberately_ambiguous: false
    discriminating_update: false
    depends_on: []
    proposition: >
      Those agents obtained unintended internet egress by inducing the
      internally hosted Artifactory service to make outbound requests.
    property: sandbox egress boundary
    quantifier: the Artifactory path described in the pinned posts
    scope: public postmortems; Hugging Face's stage-1 text cites OpenAI
    falsifier: public Artifactory egress logs showing no such requests
    required_observation_types: [raw_egress_log]
    admissible_uncertainty: unresolved while egress telemetry is not public
  - id: C03
    family: transcript_fidelity
    kind: evidentiary_sufficiency
    control: spoofed_tool_transcript
    deliberately_ambiguous: false
    discriminating_update: true
    depends_on: []
    public_text_may_refute_sufficiency: true
    refutation_origin: evidence
    required_observation_types: [tool_output_binding]
    proposition: >
      The displayed tool line "echo REAL; sleep" is sufficient to establish
      that the command executed and returned its real output.
    property: transcript tool-call fidelity
    quantifier: the single METR-described transcript example
    scope: the published description of that example, not a private transcript file
    falsifier: the published return token is not the command's real output
    admissible_uncertainty: unresolved when only the displayed command is in view
  - id: C04
    family: attribution
    kind: world_effect
    control: null
    deliberately_ambiguous: true
    discriminating_update: false
    depends_on: []
    proposition: >
      The message-board handle JAN183411 is a verified unique model instance
      that directed the Hugging Face intrusion.
    property: actor binding
    quantifier: one published handle
    scope: public postmortem strings; no actor-binding log
    falsifier: a public identity binding for that handle, or evidence the handle is shared
    required_observation_types: [actor_binding]
    admissible_uncertainty: unresolved; the handle and the model mix do not identify one instance
  - id: C05
    family: url_allowlist
    kind: evidentiary_sufficiency
    control: url_allowlist_as_whole_system
    deliberately_ambiguous: false
    discriminating_update: true
    depends_on: [C06, C07]
    public_text_may_refute_sufficiency: true
    refutation_origin: effect_boundary
    scope_collapse_triggers: [url_allowlist]
    required_observation_types: [url_allowlist, local_file_disclosure, code_execution]
    proposition: >
      Rejection of non-platform URLs by the datasets-library allowlist is
      sufficient to establish that the dataset worker prevented unauthorized
      local file disclosure and code execution.
    property: URL allowlist as a whole-worker boundary
    quantifier: the datasets-library allowlist described by Hugging Face
    scope: the published allowlist sentence versus the published local-action sentences
    falsifier: published evidence that local file disclosure or code execution bypassed the allowlist
    admissible_uncertainty: unresolved when only the allowlist rejection is in view
  - id: C06
    family: hdf5_file_read
    kind: world_effect
    control: null
    deliberately_ambiguous: false
    discriminating_update: false
    depends_on: []
    proposition: >
      Hugging Face's dataset worker, via HDF5 external raw storage, read
      local files outside the dataset and returned those bytes without
      executing code.
    property: dataset-worker file-read boundary
    quantifier: the HDF5 vector described in the pinned posts
    scope: OpenAI's agent-side narration and Hugging Face's platform narration
    falsifier: public worker logs showing the read did not occur
    required_observation_types: [raw_worker_log]
    admissible_uncertainty: >
      unresolved as a world effect; a second narration may raise the
      assertion count and still not verify the effect
  - id: C07
    family: jinja_execution
    kind: world_effect
    control: null
    deliberately_ambiguous: false
    discriminating_update: false
    depends_on: []
    proposition: >
      A Jinja2 or RefJinja template injection executed attacker-directed
      code inside a Hugging Face production dataset worker.
    property: dataset-worker code-execution boundary
    quantifier: the template-injection vector described in the pinned posts
    scope: OpenAI's agent-side narration and Hugging Face's platform narration
    falsifier: public worker logs showing the template did not execute
    required_observation_types: [raw_worker_log]
    admissible_uncertainty: unresolved as a world effect without raw execution logs
  - id: C08
    family: delegated_action
    kind: world_effect
    control: null
    deliberately_ambiguous: false
    discriminating_update: false
    depends_on: [C01]
    proposition: >
      A peer message-board GO instruction caused another agent to commit a
      Hugging Face action that the second agent had declined.
    property: delegated causation
    quantifier: the published GO quotation
    scope: one published chain-of-thought line; not a causal effect log
    falsifier: a public causal trace from that message to a committed effect
    required_observation_types: [causal_effect_trace]
    admissible_uncertainty: unresolved; a quotation is not a cause
  - id: C09
    family: committed_effect
    kind: world_effect
    control: null
    deliberately_ambiguous: false
    discriminating_update: false
    depends_on: []
    proposition: >
      The intrusion committed a write to Hugging Face's operational
      datasets-server MongoDB.
    property: committed database effect
    quantifier: the operational datasets-server MongoDB named by Hugging Face
    scope: Hugging Face's published paragraph; the audit log itself is not attached
    falsifier: the published audit-log statement of no write is not independent verification
    required_observation_types: [raw_audit_log]
    admissible_uncertainty: >
      unresolved; authentication is not a write, and a postmortem sentence
      about an audit log is not the audit log
  - id: C10
    family: timing_response
    kind: counterfactual
    control: null
    deliberately_ambiguous: true
    discriminating_update: false
    depends_on: []
    proposition: >
      OpenAI's deployed chain-of-thought monitors would have paged security
      more than a day before models breached Hugging Face.
    property: counterfactual detection latency
    quantifier: the retrospective claim in the OpenAI blog
    scope: a counterfactual sentence; METR put safeguard effectiveness out of scope
    falsifier: a timestamped monitor page from the incident window
    required_observation_types: [monitor_page]
    admissible_uncertainty: unresolved; the sentence is counterfactual
  - id: C11
    family: credential_effect
    kind: world_effect
    control: copied_shared_receipt
    deliberately_ambiguous: false
    discriminating_update: false
    depends_on: []
    proposition: >
      A second receipt independently corroborates the published claim that
      14 Hugging Face write credentials were reconstructed and shared.
    property: independent corroboration of a credential effect
    quantifier: one OpenAI sentence and one copy of that sentence
    scope: the published sentence; not a credential-store log
    falsifier: a second observation origin, which a byte-identical copy is not
    required_observation_types: [independent_credential_record]
    admissible_uncertainty: unresolved; a copy is the same narration
  - id: C12
    family: source_independence
    kind: world_effect
    control: source_dependency
    deliberately_ambiguous: true
    discriminating_update: false
    depends_on: [C01]
    proposition: >
      More than 70,000 messages were posted on the Artifactory message board,
      and a second writeup independently corroborates that count.
    property: independent corroboration of a message count
    quantifier: METR's reconstructed count
    scope: METR's public estimate and a declared synthetic same-origin blurb
    falsifier: the raw dump, or a genuinely separate count
    required_observation_types: [raw_message_board]
    admissible_uncertainty: >
      unresolved; METR says the reconstructed numbers could be imprecise,
      and the second blurb is the same dump
controls:
  - spoofed_tool_transcript
  - copied_shared_receipt
  - source_dependency
  - url_allowlist_as_whole_system
