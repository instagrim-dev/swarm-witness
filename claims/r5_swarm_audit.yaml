id: r5
source_ref: swarm-witness://swarm-audit/agents-abc
source_version: "swarm-witness-r5-v1"
original_proposition: >
  The three-way conclusion method (missing evidence, failed enforcement,
  supported) transfers from single-owner and pairwise handoff settings to a
  synthetic sequential multi-principal shared-grant model with named agents
  A/B/C, sequential contention, A→B then B→C assignment hops, and ledger-bound
  cross-agent receipt misuse.
operational_interpretation: >
  Under protocol r5-swarm-audit-v1, each declared case is classified via
  conclusion_classes. Missing peer grant observations are missing_evidence.
  Broken gates that decide allow after spend or via a foreign ledger receipt
  on a revoked grant are failed_enforcement and must not commit unauthorized
  effects. Correct sequential contention, assignee-hop checks, and
  ledger-bound cross-agent receipt denies are supported.
property: three-way conclusions under sequential multi-principal shared grants
scope: >
  Synthetic sequential in-memory model with three named principals; classical
  one-use shared grants; not concurrent worker execution; not live BMO mesh;
  not cryptographic multiparty authorization; not unbounded population.
quantifier: for each declared case in experiments/swarm_r5
success_criterion: >
  evaluate_swarm_method_success passes; agents A/B/C present; all three
  conclusion classes exercised; broken allows leave effect_committed false;
  Finding reproduced for the synthetic method-conformance claim.
assumptions:
  - "Shared grants are one-use per epoch under classical null rules"
  - "Assignment hops are sequential and recorded (A→B, then B→C)"
  - "Foreign receipts must bind to a retained ledger receipt identity"
  - "Broken-allow models a wrong decision without unauthorized effect commit"
