id: r3
property: retained start or retained grant is not permission to relaunch without fresh durable grant admission
scope: BMO sessioncompaction retained-grant owner witness tests at pinned bmo_root
quantifier: for each ordinary-retry retained-grant scenario in preferred_tests under synthetic owner witness
success_criterion: relaunch_without_fresh_durable_grant == 0 when classical admit barrier is enforced
assumptions:
  - preexisting BMO tree at artifacts/pins.yaml r3 bmo_root
  - durable grant table consulted before admit on each retry path
  - retained metadata describes prior episode, not standing launch authority
baseline: classical durable grant table checked before admit; retained state alone never authorizes relaunch
discriminating_checks:
  - retained_grant_with_expired_durable_row
  - ordinary_retry_retained_grant_owner_witness_synthetic_paths
