id: splitup_sabotage_v1
source_ref: protocol/splitup_sabotage_v1.md
source_version: splitup-sabotage-v1
original_proposition: >
  Multiple scripted principals can each appear locally authorized while their
  combined evidence manipulation causes a local-step comparator to support a
  joint safety claim that Swarm Witness refutes from application-owned
  settlement readback.
operational_interpretation: >
  Under protocol splitup-sabotage-v1, ≥6 matched honest/tampered pairs are
  scored by local_step, whole_trace_checklist, and swarm_witness. Primary
  mechanism: locals pass + joint settlement refute. Copied statements do not
  become independent witnesses; missing observer stays unresolved.
property: joint safety under split-up evidence manipulation
scope: >
  Synthetic scripted principals and local settlement fixtures only. Not
  emergent collusion; not original incident telemetry.
quantifier: each frozen case × each of the three methods
success_criterion: >
  Local records stay identical across the settlement-only pair. Swarm Witness
  and the checklist refute that pair from the settlement; the local comparator
  false-supports. joint_refuted_while_locals_pass records that scripted
  result. Emergent collusion stays unclaimed. pair_count ≥ 6.
  application_sink_executed stays false.
assumptions:
  - "Actors are scripted fixtures, not live agents"
  - "emergent_collusion_claimed stays false"
  - "Settlement rows are synthetic application-owned controls"
