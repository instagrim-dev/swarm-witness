id: incident_property_graph
source_ref: swarm-witness://incident-property-graph-v2
source_version: incident-property-graph-v2
original_proposition: Support for a local control does not support the broader system property. Decision-time entitlement, commit-time authorization, and actual commitment are separate propositions, and a revocation does not necessarily invalidate an authorization already issued.
operational_interpretation: Evaluate the versioned incident_property_graph on fixed synthetic boundary fixtures against a single-policy-pass baseline. Score public incident text against the LessWrong reproduction as the evidence standard. Original transcripts and platform logs are unavailable and are not required for a proposition to be well-formed.
property: Separation of local control, decision-time entitlement, commit-time authorization, commitment, the five boundary properties, and their conjunction P_system.
scope: Synthetic model-ledger fixtures, the 2026-07-27 Hugging Face technical timeline as narrative, and the 2026-09-11 LessWrong reproduction post as the evidence standard. Not a detection or prevention claim, and not original telemetry.
quantifier: Each fixture in experiments/incident_properties/fixtures.json and the single postmortem case in experiments/incident_properties/postmortem.yaml.
success_criterion: Graph false system-supports are 0; baseline false system-supports are at least 1; a supported local control does not support P_system; the same in-flight revocation refutes commit authorization only under the frozen closing policy; narrative propositions stay well-formed and unresolved when original transcripts and platform logs are unavailable; a deny is not counted as proof that an effect was prevented.
assumptions:
  - Synthetic settlements come from an in-model effect ledger, not from a live worker.
  - The LessWrong reproduction post is the evidence standard for the incident. It is not an original transcript and not a platform log.
  - Original agent transcripts and platform logs are unavailable. That status does not make a proposition ill-formed and is not a contract failure.
  - Public blog text is narrative provenance and does not authenticate effects.
  - Child verdicts use the evidence-set partition from the property-centric formal model.
  - No exploit payload is executed or stored as a fixture.
  - Issues 40, 41, and 42 are not implemented here.
