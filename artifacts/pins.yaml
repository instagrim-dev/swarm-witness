r4:
  source_pin: "swarm-witness-r4-v1"
  protocol_id: "r4-evidence-sufficiency-v1"
  notes: >
    Synthetic Worlds A/B evidence-sufficiency protocol implemented in-repo;
    no external third-party pin. Discriminating observation = current grant state.
r5:
  source_pin: "swarm-witness-r5-v1"
  protocol_id: "r5-swarm-audit-v1"
  notes: >
    Synthetic three-agent swarm audit (A/B/C) generalizing three-way conclusions
    to contention, delegation chains, and cross-agent receipt misuse.
incident_property_graph:
  source_pin: "incident-property-graph-v2"
  protocol_id: "incident-property-graph-v2"
  notes: >
    Property split across local control, decision-time entitlement,
    commit-time authorization, commitment, and P_system. The LessWrong
    reproduction post is the incident evidence standard. Original transcripts
    and platform logs are unavailable and are not a contract gate.
incident_comparison_v1:
  source_pin: incident-comparison-v1
  source_revision: incident-comparison-v1
  protocol_id: incident-comparison-v1
  notes: >
    Frozen public-claim comparison plus the held LessWrong reproduction
    record. The post and appendix are one record. Unavailable originals are
    not gates. The original incident is not certified.
incident_claims_v1:
  source_pin: "incident-audit-v1"
  source_revision: "incident-audit-v1"
  protocol_id: "incident-audit-v1"
  corpus_manifest: "experiments/incident_audit/corpus_manifest.yaml"
  notes: >
    Public postmortem qualification of the 2026 Artifactory / Hugging Face
    reports. Not a detection or prevention result. Raw telemetry listed in
    the manifest is unavailable.
prov_tool_call_spoof:
