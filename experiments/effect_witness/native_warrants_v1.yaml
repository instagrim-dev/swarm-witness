# Evidence-stage warrants and controlled truth for P_effect.
# Specified apart from method code. Qualifiers do not read this file.
# proposition_holds is controlled truth: false only when the harness committed
# an unauthorized_effect. A stage warrant is what that stage's observations
# warrant. Actor transcripts, withheld sinks, and misbound records do not
# decide. A packet that still contains the application sink warrants the
# controlled-truth status. Duplicate bytes and an irrelevant row do not remove
# that sink and do not add a new observation.
protocol_id: application-effect-witness-v1
proposition: P_effect
histories:
  aew-v1-h-authority-current:
    proposition_holds: true
    stages:
      actor_only: unresolved
      discriminating_readback: supported
      duplicate_irrelevant: supported
      withheld_misbound: unresolved
  aew-v1-h-authority-revoked-inflight:
