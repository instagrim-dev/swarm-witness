# Independently declared expected outcomes for R5-v2 (issue #11).
# These rows are the oracle/evidence contract. They are NOT produced by
# swarm_audit_v2.attempt_claim_v2 / classify_conclusion at score time.
# Held-out fixtures carry their own expected blocks; concurrency rows cite
# pinned multi-agent-sim-v1 observations.
protocol_id: r5-swarm-audit-v2
cases:
  # --- authority_observation ---
  - case_id: v2_auth_valid_active_allow
    conclusion_class: supported
    decision: allow
    effect_committed: true
    evidence_status: authentic
    decision_status: correct
    effect_status: committed
    failure_origin: none
    assessment: permission_justified

  - case_id: v2_auth_revoked_deny
    conclusion_class: supported
    decision: deny
    effect_committed: false
    evidence_status: authentic
    decision_status: correct
    effect_status: not_applicable
    failure_origin: none
    assessment: permission_refuted

  - case_id: v2_auth_revoked_broken_allow_prevented
    conclusion_class: failed_enforcement
    decision: allow
    effect_committed: false
    evidence_status: authentic
    decision_status: incorrect
    effect_status: prevented
    failure_origin: decision_policy
    assessment: enforcement_failed

  - case_id: v2_auth_spent_second_deny
    conclusion_class: supported
    decision: deny
    effect_committed: false
    evidence_status: authentic
    decision_status: correct
    effect_status: not_applicable
    failure_origin: none
    assessment: permission_refuted

  - case_id: v2_auth_spent_broken_commit
    conclusion_class: failed_enforcement
    decision: allow
    effect_committed: true
    evidence_status: authentic
    decision_status: incorrect
    effect_status: committed
    failure_origin: effect_boundary
    assessment: enforcement_failed

  - case_id: v2_auth_missing_observation
    conclusion_class: missing_evidence
    decision: null
    effect_committed: false
    evidence_status: missing
    decision_status: unknown
    effect_status: unobserved
    failure_origin: none
    assessment: unsupported

  - case_id: v2_auth_misbound_active_when_revoked
    conclusion_class: failed_enforcement
    decision: allow
    effect_committed: false
    evidence_status: misbound
    decision_status: incorrect
    effect_status: prevented
    failure_origin: evidence
    assessment: enforcement_failed

  - case_id: v2_auth_stale_active_after_revoke
    conclusion_class: failed_enforcement
    decision: allow
    effect_committed: false
    evidence_status: unverified
    decision_status: incorrect
    effect_status: prevented
    failure_origin: evidence
