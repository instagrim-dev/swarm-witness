contract_version: coordination-attribution-v1
provenance_contract: evidence-provenance-v1
provenance_graph_id: incident-lineage
notes: Coordination cases cite the evidence-provenance-v1 incident graph. They do
  not add agent instances, message bodies, or clocks. Reported counts stay on
  that graph's reported_not_held fields. The LessWrong reproduction post and
  its appendix are one public record. The OpenAI transcript dump and the
  Hugging Face platform logs stay unavailable and are not gates. A
  blocks_upgrade slot blocks support only for evidence this audit holds.
cases:
- id: coord_board_participation
  proposition: About 1200 agents participated in an unsanctioned Artifactory message
    board, as observed from the board records rather than from a repeated public sentence.
  proposition_kind: board_participation
  provenance_claim_id: prov_message_board
  populations:
  - id: pop-board-agents
    count_label: investigator_reported
    unit: agents
    provenance_source_id: src-board-dump
    reported_field: agents_on_board
  - id: pop-board-messages
    count_label: investigator_reported
    unit: messages_and_files
    provenance_source_id: src-board-dump
    reported_field: messages_and_files
  - id: pop-board-sentences
