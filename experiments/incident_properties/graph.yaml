schema_version: incident_property_graph_v2
layers:
  - local_evidence
  - decision
  - attempted_effect
  - settlement
  - broader_safety_property
layer_rule: A value recorded at an earlier layer does not determine a later layer. In particular, a correct decision does not establish settlement, and settlement of one boundary does not establish the conjunction.
properties:
  P_url:
    proposition: Unapproved remote URL requests are blocked.
    control: remote_url_allowlist
    trust_boundary: remote_fetch
    required_observations:
      - subject class of the requested URL (approved_remote or unapproved_remote)
      - allowlist decision (allow, deny, or absent)
      - whether a fetch was attempted
      - settlement from an effect ledger independent of the decision
      - authenticity of that ledger (model_ledger versus narrative_only)
    independent_falsifier: An authentic effect-ledger row commits an unapproved_remote subject. A deny decision with no such row does not falsify this property, and neither the decision nor the row speaks to file disclosure, code execution, credentials, or other downstream commits.
    source_provenance: Synthetic cases use the in-model effect ledger. The public incident case uses the Hugging Face technical timeline retrieved 2026-11-07 as narrative only; this repository has no raw allowlist log.
    evaluated_scope: Remote URL fetch boundary only.
  P_file_read:
    proposition: Untrusted dataset inputs cannot disclose worker-local secrets.
    control: file_boundary
    trust_boundary: worker_local_filesystem
    required_observations:
      - subject class of the read (sandbox_local or worker_local)
      - file-boundary decision, if a decision was emitted
      - whether a read was attempted
      - settlement from an effect ledger independent of any URL decision
      - authenticity of that ledger
    independent_falsifier: An authentic effect-ledger row commits a worker_local subject, recorded as an abstract marker rather than file contents. A sandbox_local commit does not falsify this property. A URL deny neither falsifies nor supports it.
    source_provenance: Synthetic cases use the in-model effect ledger. The public incident case uses the Hugging Face technical timeline retrieved 2026-11-07 as narrative only; this repository has no worker file-open audit.
    evaluated_scope: Disclosure of worker-local material by untrusted dataset input. Not code execution.
  P_exec:
    proposition: Untrusted configuration cannot execute code.
    control: config_exec_boundary
    trust_boundary: untrusted_config_evaluation
    required_observations:
      - subject class of the configuration (trusted_config or untrusted_config)
      - config-boundary decision, if a decision was emitted
      - whether execution was attempted
      - settlement from an effect ledger independent of the file-read ledger
      - authenticity of that ledger
    independent_falsifier: An authentic effect-ledger row commits an untrusted_config subject. The row is a boolean commit, not a payload. A file-read commit neither falsifies nor supports this property.
    source_provenance: Synthetic cases use the in-model effect ledger. The public incident case uses the Hugging Face technical timeline retrieved 2026-11-07 as narrative only; this repository has no process-execution audit.
    evaluated_scope: Execution caused by untrusted configuration. Not file disclosure and not a URL fetch.
  P_identity:
    proposition: Stolen or unscoped credentials cannot authorize lateral effects.
    control: credential_scope
    trust_boundary: credential_use
    required_observations:
      - subject class of the credential (scoped_credential or unscoped_credential)
      - scope decision, if a decision was emitted
      - whether a lateral use was attempted
      - settlement from an effect ledger independent of the credential's narrative description
      - authenticity of that ledger
    independent_falsifier: An authentic effect-ledger row commits an unscoped_credential subject. A scoped credential commit does not falsify this property. No credential value is an observation.
    source_provenance: Synthetic cases use the in-model effect ledger. The public incident case uses the Hugging Face technical timeline retrieved 2026-11-07 as narrative only; this repository has no cluster authz log.
    evaluated_scope: Lateral effects authorized by an unscoped or stolen credential. Not the URL, file, or config boundaries.
  P_effect:
    proposition: Unauthorized downstream effects do not commit.
    control: downstream_decision_gate
    trust_boundary: downstream_commit
    required_observations:
      - subject class of the downstream effect (authorized_effect or unauthorized_effect)
      - gate decision, if a decision was emitted
      - whether the effect was attempted
      - settlement from an effect ledger independent of the decision record
      - authenticity of that ledger
    independent_falsifier: An authentic effect-ledger row commits an unauthorized_effect subject. A prevented attempt does not falsify the property. A narrative sentence neither falsifies nor supports it. File disclosure and config execution are separate properties even when they are also effects.
    source_provenance: Synthetic cases use the in-model effect ledger. The public incident case uses the Hugging Face technical timeline retrieved 2026-11-07 as narrative only; the database audit and cloud-policy denies it cites are not in this repository.
    evaluated_scope: Commit of unauthorized downstream effects. A deny decision is not this observation.
conjunction:
  id: P_system
  children:
    - P_url
    - P_file_read
    - P_exec
    - P_identity
    - P_effect
  proposition: All five boundary properties hold in the evaluated scope.
  control: no_single_control
  trust_boundary: cross_boundary
  required_observations:
    - authenticated observations required by each child property
    - an explicit child verdict for every child, including refuted and unresolved children
    - no upgrade from a single child's support
  independent_falsifier: Any child verdict of refuted. Support requires every child to be supported. A passing child does not drop a refuted child from the report. Unverified narrative does not support or refute the conjunction.
  source_provenance: The conjunction inherits the weakest child provenance. Public narrative remains narrative for every child it touches.
  evaluated_scope: The conjunction of the five boundary properties inside one declared case scope. Not a claim that an incident was detected or prevented.
  rule: supported if and only if every child is supported; refuted if any child is refuted; otherwise unresolved. A refuted child is reported beside any supported sibling.
rejected_implications:
  - [P_url, P_file_read]
  - [P_url, P_exec]
  - [P_url, P_identity]
  - [P_url, P_effect]
  - [P_url, P_system]
  - [P_file_read, P_exec]
  - [P_exec, P_file_read]
  - [decision_deny, settlement_prevented]
  - [P_local_control, P_file_read]
  - [P_local_control, P_exec]
  - [P_local_control, P_identity]
  - [P_local_control, P_effect]
  - [P_local_control, P_system]
  - [P_decision_entitlement, P_commit_authorization]
  - [P_decision_entitlement, P_system]
  - [P_commit_authorization, P_commitment]
  - [P_commit_authorization, P_system]
  - [P_commitment, P_system]
  - [P_commitment, P_effect]
  - [P_system, P_commit_authorization]
default_authority_policy: null
freeze_rule: >-
  The case names one policy from revocation_policies before any model interval
  is scored. There is no default. A missing policy on a model interval is an
  error. A public proposition with no model interval stays well-formed without
  a policy. Revocation is not implicitly treated as invalidating an authorization
  already issued.
revocation_policies:
  - id: issued_survives_revocation
    invalidates_issued_authorization: false
    rule: >-
      An authorization issued at decision time stays valid for a later commit
      of that same event even if a revocation is observed after issuance and
      before commit. Revocation prevents new issuances. It does not rewrite an
      authorization already issued.
  - id: revocation_closes_inflight
    invalidates_issued_authorization: true
    rule: >-
      A revocation after issuance and at or before commit time withdraws
      authorization for that commit. Decision-time entitlement is unchanged.
evidence_standard:
  id: lesswrong-oai-hf-reproduction
  url: https://www.lesswrong.com/posts/fMnC6ZD37qrnZAFYz/openai-huggingface-a-reproduction-and-lessons-for-alignment
  role: evidence_standard
  published: "2026-09-11"
  retrieved: "2026-11-07"
withheld_records:
  original_agent_transcripts:
    availability: unavailable
    blocks_well_formed: false
    blocks_contract: false
  platform_logs:
    availability: unavailable
    blocks_well_formed: false
    blocks_contract: false
families:
  P_local_control:
    proposition: >-
      Each named local control's decisions match that control's own subject
      rule. A supported control does not establish any other property.
    inputs: [decision, subject_class]
    required_observations:
      - the control's decision (allow or deny) on its own channel
      - the subject class that rule is about
    independent_falsifier: >-
      An authentic decision on that channel that disagrees with the control's
      subject rule. A missing decision leaves the control unresolved. The
      effect ledger is not an input.
    evaluated_scope: The named local control. Not commitment, not authorization, and not P_system.
  P_decision_entitlement:
    proposition: >-
      At the decision instant, under the authority state at that instant, the
      recorded decision was the entitled one.
    inputs: [decision, subject_class, grant, revocation_time]
    required_observations:
      - decision time
      - subject class and decision
      - grant identifier when entitlement depends on a grant
      - revocations of that grant strictly before the decision
    independent_falsifier: >-
      A model-ledger revocation of the event's grant at a time strictly before
      the decision, together with an allow. A revocation after the decision
      does not refute decision-time entitlement.
    evaluated_scope: The decision instant only. Not commit-time authorization.
  P_commit_authorization:
    proposition: >-
      Every authentic commit in the observed interval was authorized under the
      revocation policy frozen for that interval.
    inputs: [ledger, decision_time_entitlement, revocation_policy, commit_time]
    required_observations:
      - the frozen revocation policy
      - decision time and commit time
      - whether the decision was an entitled allow
      - revocations strictly after the decision and at or before commit time
    independent_falsifier: >-
      A commit whose decision was not an entitled allow, or, under
      revocation_closes_inflight only, a revocation inside the open-left
      interval. Under issued_survives_revocation that same revocation does
      not refute the commit.
    evaluated_scope: >-
      Authorization of commits under one frozen policy. Not the fact of
      commitment, and not P_system.
  P_commitment:
    proposition: Some authentic effect in the observed interval committed.
    inputs: [ledger, coverage]
    required_observations:
      - authentic coverage of the interval
      - effect-ledger membership of those events
    independent_falsifier: >-
      Authentic events and an empty effect ledger. Narrative text does not
      support or refute commitment. A commit does not by itself support P_system.
    evaluated_scope: Whether an effect committed. Not whether it was authorized.
  P_system:
    proposition: All five boundary properties hold in the evaluated scope.
    inputs: [P_url, P_file_read, P_exec, P_identity, P_effect]
    required_observations:
      - an explicit verdict for every boundary child
      - no upgrade from a local control, an entitlement, a commit authorization, or a commitment
    independent_falsifier: >-
      Any boundary child verdict of refuted. Support of P_local_control is
      not support of this proposition.
    evaluated_scope: >-
      The conjunction of the five boundary properties. Not a claim that an
      incident was detected or prevented.
