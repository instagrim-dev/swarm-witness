telemetry_required:
- id: T1
  property: P_url
  observation: Dataset-worker allowlist decisions with timestamp, worker id, URL class (platform
    or non-platform), decision enum, and whether a fetch client was invoked.
  why_insufficient: The timeline paraphrases a ValueError. That sentence is not the allowlist
    log, and a reported rejection is not an observation that other boundaries held. The record
    is unavailable. That is not a property-contract failure, and the proposition is well-formed
    without it.
  qualifying_source: Hugging Face dataset-worker or datasets-library audit for the cited requests.
  availability: unavailable
  blocks_well_formed: false
  blocks_contract: false
- id: T2
  property: P_file_read
  observation: File-open audit with path class (dataset sandbox or worker-local), dataset
    revision, and whether bytes were returned. Not the bytes.
  why_insufficient: The timeline asserts a worker-local read and says no code ran. This repository
    does not contain the open audit, so the disclosure is not independently refuted or supported.
    The record is unavailable. That is not a property-contract failure, and the proposition
    is well-formed without it.
  qualifying_source: Worker filesystem audit bound to the dataset revision, separate from
    the blog text.
  availability: unavailable
  blocks_well_formed: false
  blocks_contract: false
- id: T3
  property: P_exec
  observation: Boolean that untrusted configuration was evaluated as code, with workload id
    and timestamp. Not the template and not a payload.
  why_insufficient: The timeline separates code execution from the file-read vector. The separation
    is a narrative claim until a process audit records the boolean independently of the file-open
    audit. The record is unavailable. That is not a property-contract failure, and the proposition
    is well-formed without it.
  qualifying_source: Worker process or config-evaluation audit that does not reuse the file-open
    record as its only source.
  availability: unavailable
  blocks_well_formed: false
  blocks_contract: false
- id: T4
  property: P_identity
  observation: Credential identifier (not the secret), intended scope, API called, and allow
    or deny. For the broker sentence, the cluster authz decision for that identity.
  why_insufficient: The timeline says one shared connector identity was cluster-admin. The
    authz log is not in this repository, and the sentence is not a URL-allowlist observation.
    The record is unavailable. That is not a property-contract failure, and the proposition
    is well-formed without it.
  qualifying_source: Cluster authorization log for the cited identity, with scope and decision,
    secret redacted.
  availability: unavailable
  blocks_well_formed: false
  blocks_contract: false
- id: T5
  property: P_effect
  observation: Mutating-call ledger with commit or deny, actor, and timestamp, for cloud calls
    and database writes separately from file-read and code-execution rows.
  why_insufficient: The timeline cites a database audit with no writes and cloud policy denies,
    and elsewhere describes file bytes returned and code run. Those are different effect classes.
    The cited audits are not here, so none of them is a settled observation. The record is
    unavailable. That is not a property-contract failure, and the proposition is well-formed
    without it.
  qualifying_source: Cloud control-plane audit and the database audit log named in the timeline.
  availability: unavailable
  blocks_well_formed: false
  blocks_contract: false
- id: T6
  property: cross_source
  observation: A join key across the worker log, the Hugging Face API dataset commit, and
    the external sandbox log, each labeled with its owner.
  why_insufficient: Hugging Face describes a reconstruction from sandbox logs correlated with
    platform logs. OpenAI's public post is another narration of the same episode. Neither
    page is a substitute for those records, and agreement between the two pages is not an
    independent effect ledger. The record is unavailable. That is not a property-contract
    failure, and the proposition is well-formed without it.
  qualifying_source: The underlying records, with source owner and redaction manifest. Not
    built in this issue.
  availability: unavailable
  blocks_well_formed: false
  blocks_contract: false
