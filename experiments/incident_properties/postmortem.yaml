excerpts:
- id: hf-url-allowlist
  source_id: huggingface-technical-timeline
  anchor: Stage 2, paragraph beginning both vectors sidestepped the same defense
  quote: 'the datasets library''s URL allowlist rejected every non-platform URL before any
    fetch (ValueError: not an hf path). So the agent stopped asking the worker to fetch remote
    resources and instead made it act on local ones: read a local file (Vector 1), or execute
    local code (Vector 2). Neither is a URL fetch, so the allowlist never saw them.'
  quote_start: mid-sentence
  omitted: The preceding clause names a remote-endpoint example and is not reproduced.
  payload_reproduced: false
  property: P_url
- id: hf-file-disclosure
  source_id: huggingface-technical-timeline
  anchor: Stage 2, Vector 1, HDF5 external raw storage file read
  quote: When the worker opened the file to build the split, it read the raw bytes from that
    path and returned them as the dataset's rows, which the agent then read back over the
    HF API. No code ran; this vector is purely a file disclosure, and it is the one the agent
    used first.
  omitted: The config fragment that names worker paths is not reproduced.
  payload_reproduced: false
  property: P_file_read
- id: hf-code-execution
  source_id: huggingface-technical-timeline
  anchor: Stage 2, Vector 2, opening sentence and the sentence after the omitted template
  quote: The second vector is server-side template injection, which gave the agent code execution.
    [...] This ran arbitrary Python inside a production conversion worker pod on our Kubernetes
    cluster, driven by injection from the launchpad.
  omitted: The template expression between these sentences is not reproduced.
  payload_reproduced: false
  property: P_exec
- id: hf-credential-scope
  source_id: huggingface-technical-timeline
  anchor: Day 3, internal service-connector access
  quote: We had wrongly provisioned that broker with a single connector credential shared
    across clusters, and bound the connector identity to system:masters. One stolen system
    credential was therefore cluster-admin everywhere.
  omitted: Commands and hostnames from the surrounding section are not reproduced.
  payload_reproduced: false
  property: P_identity
- id: hf-effect-not-uniform
  source_id: huggingface-technical-timeline
  anchor: Day 3, cloud-role replay and internal database paragraphs
  quote: Every mutating call was denied by the role's policy. What it gained here was a map,
    not control. [...] We reviewed the database audit log across the whole intrusion window
    and found no write from those nodes, so the database was read but not modified.
  omitted: These sentences are joined from two paragraphs. They do not describe every effect
    the page narrates, which is why P_effect is mixed.
  payload_reproduced: false
  property: P_effect
- id: lw-reproduction-scope
  source_id: lesswrong-oai-hf-reproduction
  anchor: Opening, project summary
  quote: We reproduce the misaligned AI behaviors that led to the OpenAI–Hugging Face incident
    in an environment that simulates the original pipelines and tools, with publicly available
    models.
  payload_reproduced: false
  property: evidence_standard
- id: lw-distinct-steps
  source_id: lesswrong-oai-hf-reproduction
  anchor: Section 1, paragraph before the four steps
  quote: multiple distinct misaligned behaviors were chained together and compounded over
    many thousands of agentic trajectories.
  payload_reproduced: false
  property: evidence_standard
- id: lw-step1-write
  source_id: lesswrong-oai-hf-reproduction
  anchor: Section 1, step 1. The exploit procedure is not reproduced.
  quote: it writes test files into shared infrastructure as exploratory probes, as shown in
    Figure 1a. The SSRF and writes were not intended uses of Artifactory.
  payload_reproduced: false
  property: evidence_standard
- id: lw-not-original
  source_id: lesswrong-oai-hf-reproduction
  anchor: Section 2, comparison point 3
  quote: We don’t know what notes were present in the real incident, but this is the most
    likely place our replication is unfaithful.
  payload_reproduced: false
  property: evidence_standard
- id: lw-own-transcripts
  source_id: lesswrong-oai-hf-reproduction
  anchor: Opening, release sentence
  quote: We release our code and transcripts.
  payload_reproduced: false
  property: evidence_standard
