<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Prior systems and the comparisons in this paper</title>
  <desc id="desc">BMO, SoundGate, and EvidenceGraph predate this protocol and answer different questions. This paper compares a classical gate with BMO, and compares the Swarm Witness qualifier with the invariant checker.</desc>
  <defs>
    <style>
      @font-face { font-family: "Old Standard TT"; src: url("../../fonts/OldStandardTT-regular.ttf"); font-weight: 400; }
      @font-face { font-family: "Old Standard TT"; src: url("../../fonts/OldStandardTT-bold.ttf"); font-weight: 700; }
      text { font-family: "Old Standard TT", "Times New Roman", Times, serif; fill: #1a1a1a; }
    </style>
  </defs>
  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="48" y="48" font-size="20" fill="#434343" letter-spacing="1.4">PRIOR ART, ALREADY IN PLACE</text>
  <g>
    <rect x="48" y="72" width="480" height="250" fill="#f7f5f0" stroke="#1a1a1a" stroke-width="2"/>
    <text x="76" y="130" font-size="32" font-weight="700">BMO</text>
    <text x="76" y="190" font-size="26">Owned authority</text>
    <text x="76" y="230" font-size="26">and settlement.</text>
  </g>
  <g>
    <rect x="560" y="72" width="480" height="250" fill="#f7f5f0" stroke="#1a1a1a" stroke-width="2"/>
    <text x="588" y="130" font-size="32" font-weight="700">SoundGate</text>
    <text x="588" y="190" font-size="26">Whether restart preserves</text>
    <text x="588" y="230" font-size="26">a durable refusal.</text>
  </g>
  <g>
    <rect x="1072" y="72" width="480" height="250" fill="#f7f5f0" stroke="#1a1a1a" stroke-width="2"/>
    <text x="1100" y="130" font-size="32" font-weight="700">EvidenceGraph</text>
    <text x="1100" y="190" font-size="26">A receipt does not establish</text>
    <text x="1100" y="230" font-size="26">event attribution.</text>
  </g>

  <text x="48" y="390" font-size="20" fill="#434343" letter-spacing="1.4">COMPARED IN THIS PAPER</text>
  <g>
    <rect x="48" y="414" width="480" height="300" fill="#f3f8f5" stroke="#1F7A4D" stroke-width="2"/>
    <text x="76" y="470" font-size="22" fill="#1F7A4D" letter-spacing="1.2">CONTRACT</text>
    <text x="76" y="530" font-size="28" font-weight="700">BMO records</text>
    <text x="76" y="572" font-size="28" font-weight="700">and a SQLite gate</text>
    <text x="76" y="640" font-size="24" fill="#434343">Separate implementation.</text>
    <text x="76" y="676" font-size="24" fill="#434343">Not an adjudicator.</text>
  </g>
  <g>
    <rect x="560" y="414" width="480" height="300" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="588" y="470" font-size="22" fill="#434343" letter-spacing="1.2">APPLICATION PACKETS</text>
    <text x="588" y="530" font-size="28" font-weight="700">Qualifier and the</text>
    <text x="588" y="572" font-size="28" font-weight="700">invariant checker</text>
    <text x="588" y="640" font-size="24" fill="#434343">Paired methods.</text>
    <text x="588" y="676" font-size="24" fill="#434343">Same 48 packets.</text>
  </g>
  <g>
    <rect x="1072" y="414" width="480" height="300" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="1100" y="470" font-size="22" fill="#434343" letter-spacing="1.2">COMPOSITION</text>
    <text x="1100" y="530" font-size="28" font-weight="700">Both methods read</text>
    <text x="1100" y="572" font-size="28" font-weight="700">one adapter</text>
    <text x="1100" y="640" font-size="24" fill="#434343">EvidenceGraph records.</text>
    <text x="1100" y="676" font-size="24" fill="#434343">Not a new source.</text>
  </g>
  <text x="48" y="790" font-size="24" fill="#434343">SoundGate is prior art. It is not the paired method on the application packets.</text>
</svg>
