<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">One execution, three observations</title>
  <desc id="desc">A passing URL allowlist and a forbidden downstream write are different boundaries. The actor transcript leaves P_effect unresolved. The sink readback refutes it.</desc>
  <defs>
    <style>
      @font-face { font-family: "Old Standard TT"; src: url("../../fonts/OldStandardTT-regular.ttf"); font-weight: 400; }
      @font-face { font-family: "Old Standard TT"; src: url("../../fonts/OldStandardTT-bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Old Standard TT"; src: url("../../fonts/OldStandardTT-italic.ttf"); font-style: italic; font-weight: 400; }
      text { font-family: "Old Standard TT", "Times New Roman", Times, serif; fill: #1a1a1a; }
    </style>
  </defs>
  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="48" y="64" font-size="22" fill="#434343" letter-spacing="1.5">ONE EXECUTION</text>
  <text x="48" y="118" font-size="40" font-weight="700" fill="#434343">The allowlist passes. The forbidden write commits.</text>
  <line x1="48" y1="148" x2="1552" y2="148" stroke="#000000" stroke-width="3"/>

  <path d="M500 425 h36" fill="none" stroke="#9A6B12" stroke-width="3"/>
  <path d="M536 412 v26" fill="none" stroke="#9A6B12" stroke-width="3"/>
  <path d="M1024 425 h40" fill="none" stroke="#9B3A3A" stroke-width="3"/>
  <path d="M1052 413 l16 12 l-16 12" fill="none" stroke="#9B3A3A" stroke-width="3"/>

  <g>
    <rect x="48" y="190" width="470" height="470" fill="#f3f8f5" stroke="#1F7A4D" stroke-width="2"/>
    <rect x="48" y="190" width="470" height="12" fill="#1F7A4D"/>
    <text x="80" y="258" font-size="20" fill="#1F7A4D" letter-spacing="1.2">LOCAL CONTROL</text>
    <text x="80" y="338" font-size="36" font-weight="700">Allowlist passes</text>
    <text x="80" y="386" font-size="24" fill="#434343">remote_url_allowlist</text>
    <line x1="80" y1="520" x2="486" y2="520" stroke="#d9d9d9"/>
    <circle cx="104" cy="572" r="16" fill="none" stroke="#1F7A4D" stroke-width="3"/>
    <path d="M94 572 l6 6 l12 -12" fill="none" stroke="#1F7A4D" stroke-width="3"/>
    <text x="136" y="584" font-size="32" font-weight="700" fill="#1F7A4D">Supported</text>
  </g>
  <g>
    <rect x="566" y="190" width="470" height="470" fill="#fbf8f1" stroke="#9A6B12" stroke-width="2"/>
    <rect x="566" y="190" width="470" height="12" fill="#9A6B12"/>
    <text x="598" y="258" font-size="20" fill="#9A6B12" letter-spacing="1.2">ACTOR TRANSCRIPT</text>
    <text x="598" y="338" font-size="36" font-weight="700">No sink record</text>
    <text x="598" y="386" font-size="24" fill="#434343">sees the control</text>
    <text x="598" y="424" font-size="24" fill="#434343">not the write</text>
    <line x1="598" y1="520" x2="1004" y2="520" stroke="#d9d9d9"/>
    <circle cx="622" cy="572" r="16" fill="none" stroke="#9A6B12" stroke-width="3"/>
    <path d="M610 572 h24" fill="none" stroke="#9A6B12" stroke-width="3"/>
    <text x="654" y="584" font-size="30" font-weight="700" fill="#9A6B12">P_effect unresolved</text>
  </g>
  <g>
    <rect x="1084" y="190" width="470" height="470" fill="#fbf4f4" stroke="#9B3A3A" stroke-width="2"/>
    <rect x="1084" y="190" width="470" height="12" fill="#9B3A3A"/>
    <text x="1116" y="258" font-size="20" fill="#9B3A3A" letter-spacing="1.2">SINK READBACK</text>
    <text x="1116" y="338" font-size="36" font-weight="700">Write committed</text>
    <text x="1116" y="386" font-size="24" fill="#434343">bound to the same run</text>
    <line x1="1116" y1="520" x2="1522" y2="520" stroke="#d9d9d9"/>
    <circle cx="1140" cy="568" r="16" fill="none" stroke="#9B3A3A" stroke-width="3"/>
    <path d="M1128 556 l24 24 M1152 556 l-24 24" fill="none" stroke="#9B3A3A" stroke-width="3"/>
    <text x="1172" y="578" font-size="28" font-weight="700" fill="#9B3A3A">P_effect refuted</text>
    <text x="1172" y="616" font-size="24" fill="#9B3A3A">P_system refuted</text>
  </g>
  <text x="48" y="760" font-size="26">Same history. Each record answers only its own proposition.</text>
  <text x="48" y="808" font-size="24" font-style="italic" fill="#434343">The local control remains supported.</text>
</svg>
